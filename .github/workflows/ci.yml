name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.24
      - run: mise run bootstrap
      # check は lock の版の CLI で dev-standards check を行い、lint・format:check・test・build も実行する。
      - run: mise run check
  # main の ruleset は `workflow-result` を必須チェックにしている（terraform-github の標準保護）。
  # dev-standards が生成するジョブ名は `standards-check` なので、同じ検査をここで集約する。
  workflow-result:
    needs: [verify]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: 全検証の成功を確認
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$VERIFY_RESULT" != success ]; then
            echo "必要な CI ジョブが成功していません: $VERIFY_RESULT" >&2
            exit 1
          fi
